<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>For Divya ❤️</title>  <style>  
*{  
margin:0;  
padding:0;  
box-sizing:border-box;  
font-family:Arial,sans-serif;  
}  
  
body{  
height:100vh;  
display:flex;  
justify-content:center;  
align-items:center;  
overflow:hidden;  
background:linear-gradient(-45deg,#ff9ecb,#ffd6e8,#ff7eb3,#ffc4d6);  
background-size:400% 400%;  
animation:bg 10s infinite;  
}  
  
@keyframes bg{  
0%{background-position:0 50%;}  
50%{background-position:100% 50%;}  
100%{background-position:0 50%;}  
}  
  
.card{  
width:90%;  
max-width:420px;  
background:rgba(255,255,255,.2);  
backdrop-filter:blur(12px);  
padding:25px;  
border-radius:20px;  
text-align:center;  
box-shadow:0 0 30px rgba(255,255,255,.5);  
color:#fff;  
animation:pop 1s;  
}  
  
@keyframes pop{  
from{transform:scale(.7);opacity:0;}  
to{transform:scale(1);opacity:1;}  
}  
  
h1{  
font-size:34px;  
animation:heart 1s infinite;  
}  
  
@keyframes heart{  
50%{transform:scale(1.08);}  
}  
  
p{  
margin:20px 0;  
font-size:18px;  
line-height:1.6;  
}  
  
button{  
padding:14px 30px;  
border:none;  
border-radius:50px;  
background:#ff2e63;  
color:#fff;  
font-size:18px;  
cursor:pointer;  
transition:.3s;  
}  
  
button:hover{  
transform:scale(1.08);  
box-shadow:0 0 20px #fff;  
}  
  
.heart{  
position:fixed;  
font-size:25px;  
animation:fly 6s linear infinite;  
opacity:.8;  
}  
  
@keyframes fly{  
0%{  
transform:translateY(100vh) rotate(0deg);  
opacity:0;  
}  
20%{opacity:1;}  
100%{  
transform:translateY(-120vh) rotate(360deg);  
opacity:0;  
}  
}  
</style>  </head>  <body>  <div class="card">  <h1>💖 Divya 💖</h1>  <p id="text">  
Hey Divya 🌸<br><br>  Tumhari smile sabse pyari hai 😊<br>
Agar tum hastae ho to duniya aur bhi sundar lagti hai. ❤️<br><br>

🐻 Teddy bhi kehta hai...<br>
"Please Smile Divya ❤️"

</p>  <button onclick="love()">Click Me 💕</button>

</div>  <script>  
  
for(let i=0;i<30;i++){  
  
let h=document.createElement("div");  
  
h.className="heart";  
  
h.innerHTML=["❤️","💖","💕","🌸","🐻","🐰"][Math.floor(Math.random()*6)];  
  
h.style.left=Math.random()*100+"vw";  
  
h.style.animationDuration=4+Math.random()*5+"s";  
  
h.style.fontSize=20+Math.random()*20+"px";  
  
document.body.appendChild(h);  
  
}  
  
function love(){  
  
document.getElementById("text").innerHTML=`  
<h2>💌 Surprise 💌</h2>  
  
<div style="font-size:70px;">🧸🌹🐰</div>  
  
<p>  
  
Divya ❤️<br><br>  
  
Chahe kitni bhi nok-jhok ho...<br>  
  
Tum bahut special ho. 💖<br><br>  
  
Promise 😊<br>  
  
Main hamesha tumhari smile dekhna chahta hoon. ❤️🌸  
  
</p>  
  
`;  
  
alert("❤️ Smile Please Divya ❤️");  
  
}  
  
</script>  </body>  
</html>
